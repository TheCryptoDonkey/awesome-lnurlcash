name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: awesome-lint
        run: npx awesome-lint
      - name: no dead links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress README.md CONTRIBUTING.md
          fail: true
